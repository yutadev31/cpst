[package]
name = "cpst"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/yutadev31/cpst.git"
license = "MIT"

[dependencies]
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
thiserror = "2.0.21"

[profile.release]
lto = "thin"
